AWSTemplateFormatVersion: '2010-09-09'
Description: create a single S3 bucket

Parameters:
  Namespace:
    Type: String
    Description: An environment name that will be prefixed to resource names 
  KMSKeyArn:
    Type: String
    Description: "If having KMS Key ARN, Pass ARN"
    Default: "Default"
  SSEAlgorithm:
    Type: String
    Description: "If KMS key ARN passed,select aws:kms Encryption algorithm"
    Default: "AES256"
    AllowedValues:
      - aws:kms
      - AES256
  EnableS3Files:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable Amazon S3 Files for this bucket"

Conditions:
  AES256: !Equals [!Ref SSEAlgorithm, "AES256"]   
  EnableS3FilesCondition: !Equals [!Ref EnableS3Files, "true"]
Resources:
  SampleBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref Namespace
      BucketEncryption: 
        ServerSideEncryptionConfiguration: 
        - !If
          - AES256
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: !Ref SSEAlgorithm
            BucketKeyEnabled: true
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: !Ref SSEAlgorithm
              KMSMasterKeyID: !Ref KMSKeyArn
            BucketKeyEnabled: true
      VersioningConfiguration: !If
        - EnableS3FilesCondition
        - Status: Enabled
        - !Ref AWS::NoValue
      Tags:
        - Key: cost_resource
          Value: !Sub ${AWS::StackName}
        - Key: Name
          Value: !Sub ${Namespace}

  S3FilesAccessRole:
    Type: AWS::IAM::Role
    Condition: EnableS3FilesCondition
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: elasticfilesystem.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3FilesBucketAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3BucketAccess
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !GetAtt SampleBucket.Arn
              - Sid: S3ObjectAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${SampleBucket.Arn}/*"
              - !If
                - AES256
                - !Ref AWS::NoValue
                - Sid: KmsAccess
                  Effect: Allow
                  Action:
                    - kms:Decrypt
                    - kms:GenerateDataKey
                  Resource: !Ref KMSKeyArn

  S3FileSystem:
    Type: AWS::S3Files::FileSystem
    Condition: EnableS3FilesCondition
    DependsOn:
      - S3FilesAccessRole
      - SampleBucket
    Properties:
      AcceptBucketWarning: true
      Bucket: !GetAtt SampleBucket.Arn
      RoleArn: !GetAtt S3FilesAccessRole.Arn
      KmsKeyId: !If
        - AES256
        - !Ref AWS::NoValue
        - !Ref KMSKeyArn
      Tags:
        - Key: cost_resource
          Value: !Sub ${AWS::StackName}
        - Key: Name
          Value: !Sub ${Namespace}-s3files

  BucketPolicy:
    Type: "AWS::S3::BucketPolicy"
    Properties:
      Bucket: !Ref SampleBucket      
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnforceTLS12
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "${SampleBucket.Arn}"
              - !Sub "${SampleBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"
          - Sid: EnforceTLS12OrHigher
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "${SampleBucket.Arn}"
              - !Sub "${SampleBucket.Arn}/*"
            Condition:
              NumericLessThan:
                "s3:TLSVersion": "1.2"

Outputs:
  BucketArn:
    Value: !GetAtt [SampleBucket, Arn]
    Description: URL for website hosted on S3
  BucketName:
    Value: !Ref SampleBucket
    Description: Name of S3 bucket
  S3FileSystemId:
    Condition: EnableS3FilesCondition
    Value: !GetAtt S3FileSystem.FileSystemId
    Description: Amazon S3 Files file system ID for bootstrap and mount scripts