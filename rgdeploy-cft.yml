AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::SecretsManager-2020-07-23
Description: >
  Unified CloudFormation Template for Research Gateway.
  Provisions ALB, Cognito, DocumentDB, EC2, and all required resources in a single stack.
  VPC and subnets must be created externally and passed as parameters.

Parameters:
  RgSRC:
    Type: String
    Default: "/home/ec2-user/rgdeploy"
    Description: Directory path where Research Gateway deployment files will be stored
  AMIId:
    Description: The AMI for the EC2 instance running Research Gateway
    Type: AWS::EC2::Image::Id
  CFTBucketName:
    Description: S3 bucket holding deployment/config files
    Type: String
  VPC:
    Description: VPC for all resources
    Type: String
  PublicSubnet1:
    Description: Public subnet 1 for ALB
    Type: String
  PublicSubnet2:
    Description: Public subnet 2 for ALB
    Type: String
  PublicSubnet3:
    Description: Public subnet 3 for ALB
    Type: String
  PrivateSubnet1:
    Description: Private subnet 1 for DocumentDB/EC2
    Type: String
  PrivateSubnet2:
    Description: Private subnet 2 for DocumentDB/EC2
    Type: String
  PrivateSubnet3:
    Description: Private subnet 3 for DocumentDB/EC2
    Type: String
  KeyPairName:
    Description: Keypair for EC2 SSH access
    Type: AWS::EC2::KeyPair::KeyName
  Environment:
    Description: Deployment environment (DEV, QA, STAGE, PROD)
    Type: String
    AllowedValues: [DEV, QA, STAGE, PROD]
  RGUrl:
    Description: URL at which Research Gateway will be accessed
    Type: String
  CertificateArn:
    Description: ACM Certificate ARN for SSL (optional)
    Type: String
    Default: ""
  HostedZoneId:
    Description: Route53 Hosted Zone ID for the RG domain (required for config generation)
    Type: String
  BaseAccountPolicyName:
    Description: Name for RG Portal Base Account Policy
    Type: String
  RunId:
    Description: Unique run identifier used to name the cross-account project role (RG-Portal-ProjectRole-<Environment>-<RunId>)
    Type: String
    MinLength: 1
    MaxLength: 32
    AllowedPattern: "[_a-zA-Z0-9-]+"
    ConstraintDescription: Must contain only alphanumeric characters, hyphens, and underscores (max 32 chars so the derived role name fits IAM limits)
  AdminEmail:
    Description: Email address for the first admin user
    Type: String

Conditions:
  UseSSL:
    Fn::Not:
      - Fn::Equals:
          - !Ref CertificateArn
          - ""
  DoNotUseSSL:
    Fn::Equals:
      - !Ref CertificateArn
      - ""

Resources:

  RGInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow http/https/ssh to client host
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0  
          

  RGApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${Environment}-rg-alb"
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
        - !Ref PublicSubnet3
      SecurityGroups:
        - !Ref RGInstanceSecurityGroup
      IpAddressType: ipv4

  RGTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${Environment}-rg-target"
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: "200"

  RGHTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: DoNotUseSSL
    Properties:
      LoadBalancerArn: !Ref RGApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref RGTargetGroup

  RGHTTPRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: UseSSL
    Properties:
      LoadBalancerArn: !Ref RGApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            Host: "#{host}"
            Path: "/#{path}"
            Query: "#{query}"
            StatusCode: HTTP_301

  RGHTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: UseSSL
    Properties:
      LoadBalancerArn: !Ref RGApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-2016-08
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref RGTargetGroup

  # Portal IAM Role
  RGPortalRole:
    Type: AWS::IAM::Role
    Properties:
      Description: The role used by the EC2 Instance running the portal
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - Ref: ResearchGatewayRolePolicy
      Path: /
  ResearchGatewayInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - Ref: RGPortalRole
  ResearchGatewayRolePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Ref BaseAccountPolicyName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "InstancePermissions"
            Effect: Allow
            Action:
              - ec2:DescribeImages
              - ec2:CopyImage
              - ec2:ModifyImageAttribute
              - ec2:ModifyInstanceMetadataOptions
              - elasticloadbalancing:RegisterTargets
              - logs:DescribeLogGroups
            Resource: "*"
          - Sid: "ECRPullAccess"
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchCheckLayerAvailability
            Resource: "*"
          - Sid: "PutObjectAndBucketPolicyOnCFTBucket"
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:PutBucketPolicy
            Resource:
              - !Sub "arn:aws:s3:::${CFTBucketName}"
              - !Sub "arn:aws:s3:::${CFTBucketName}/*"
          - Sid: "AssumeProjectRole"
            Effect: Allow
            Action:
              - sts:AssumeRole
            Resource: !Sub "arn:aws:iam::*:role/RG-Portal-ProjectRole-${Environment}-${RunId}"
          - Sid: "KMSPermissionsForDeploymentAndAMIs"
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
              - kms:DescribeKey
              - kms:CreateGrant
              - kms:GetKeyPolicy
              - kms:Encrypt
            Resource:
              - !Sub "arn:aws:kms:*:${AWS::AccountId}:key/*"
            Condition:
              StringEquals:
                kms:CallerAccount: !Ref AWS::AccountId
          - Sid: "ReadDocDBSecret"
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource: !Ref DocDBClusterRotationSecret
          - Sid: "Route53ChangeRecords"
            Effect: Allow
            Action:
              - route53:ChangeResourceRecordSets
            Resource:
              - !Sub "arn:aws:route53:::hostedzone/${HostedZoneId}"
          - Sid: "CognitoUserPoolRuntime"
            Effect: Allow
            Action:
              - cognito-idp:ListUsers
              - cognito-idp:AdminSetUserPassword
              - cognito-idp:AdminDisableUser
              - cognito-idp:AdminEnableUser
              - cognito-idp:AdminDeleteUser
              - cognito-idp:AdminInitiateAuth
              - cognito-idp:AdminRespondToAuthChallenge
            Resource: !GetAtt CognitoUserPool.Arn
  DnsRecord:
      Type: AWS::Route53::RecordSet
      Properties:
        HostedZoneId: !Ref HostedZoneId
        Name: !Select [2, !Split ["/", !Ref RGUrl]]
        Type: A
        AliasTarget:
          DNSName: !GetAtt RGApplicationLoadBalancer.DNSName
          HostedZoneId: !GetAtt RGApplicationLoadBalancer.CanonicalHostedZoneID

  # EC2 Instance for Research Gateway Portal
  RGEC2Instance:
      Type: AWS::EC2::Instance
      DependsOn: DnsRecord
      Properties:
        ImageId: !Ref AMIId
        InstanceType: t3.large
        Monitoring: true
        DisableApiTermination: false
        IamInstanceProfile: !Ref ResearchGatewayInstanceProfile
        KeyName: !Ref KeyPairName
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeType: gp2
              VolumeSize: 80
              DeleteOnTermination: true
              Encrypted: true
        SubnetId: !Ref PrivateSubnet1
        SecurityGroupIds:
          - !Ref RGInstanceSecurityGroup
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 2
          HttpEndpoint: enabled
        UserData:
          Fn::Base64: !Sub
            - |
              #!/bin/bash
              exec > >(tee /var/log/user-data.log|logger -t user-data -s 2>/dev/console) 2>&1

              export RG_HOME=/opt/deploy/sp2
              export RG_ENV=${Environment}
              export RG_SRC=${RgSRC}
              export S3_SOURCE="${CFTBucketName}"
              export REGION=${AWS::Region}

              mkdir -p "$RG_SRC" "$RG_HOME"

              # Detect OS and install packages (Ubuntu apt vs Amazon Linux 2023 dnf)
              # Use $VAR not brace-form for bash vars so Fn::Sub does not treat them as refs
              if [ -f /etc/os-release ]; then
                # shellcheck disable=SC1091
                . /etc/os-release
              fi
              echo "Detected OS: $ID $VERSION_ID"

              if [ "$ID" = "ubuntu" ] || [ "$ID_LIKE" = "debian" ] || command -v apt-get >/dev/null 2>&1; then
                export DEBIAN_FRONTEND=noninteractive
                apt-get update -y
                apt-get install -y jq curl wget gnupg ca-certificates apt-transport-https software-properties-common

                if ! command -v docker >/dev/null 2>&1; then
                  apt-get install -y docker.io
                fi
                systemctl enable --now docker
                usermod -aG docker ubuntu 2>/dev/null || usermod -aG docker ec2-user 2>/dev/null || true

                if [ -z "$VERSION_CODENAME" ]; then
                  VERSION_CODENAME=$(lsb_release -cs 2>/dev/null || echo jammy)
                fi
                # DocumentDB 4.0 needs legacy mongo shell + mongoimport; mongosh 2.x is incompatible
                curl -fsSL https://pgp.mongodb.com/server-5.0.asc | gpg --dearmor -o /usr/share/keyrings/mongodb-server-5.0.gpg
                echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-5.0.gpg ] https://repo.mongodb.org/apt/ubuntu $VERSION_CODENAME/mongodb-org/5.0 multiverse" \
                  > /etc/apt/sources.list.d/mongodb-org-5.0.list
                apt-get update -y
                apt-get install -y mongodb-org-shell mongodb-database-tools
                apt-get remove -y mongodb-mongosh 2>/dev/null || true

                if [ ! -x /opt/aws/bin/cfn-signal ]; then
                  apt-get install -y python3-pip
                  pip3 install --break-system-packages https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-py3-latest.tar.gz \
                    || pip3 install https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-py3-latest.tar.gz
                  mkdir -p /opt/aws/bin
                  CFN_SIGNAL_BIN=$(command -v cfn-signal || true)
                  if [ -n "$CFN_SIGNAL_BIN" ]; then
                    ln -sf "$CFN_SIGNAL_BIN" /opt/aws/bin/cfn-signal
                  fi
                fi

              elif [ "$ID" = "amzn" ] || [ "$ID" = "amazon" ] || command -v dnf >/dev/null 2>&1; then
                # AL2023 ships curl-minimal; installing curl conflicts and fails the transaction.
                dnf_install() {
                  local attempt
                  for attempt in $(seq 1 30); do
                    if dnf install -y "$@"; then
                      return 0
                    fi
                    echo "dnf install failed (attempt $attempt), retrying in 10s..."
                    sleep 10
                  done
                  return 1
                }

                dnf_install jq wget aws-cfn-bootstrap docker
                command -v curl >/dev/null 2>&1 || dnf_install curl-minimal

                # DocumentDB 4.0 needs legacy mongo shell + mongoimport; mongosh 2.x is incompatible
                printf '%s\n' \
                  '[mongodb-org-5.0]' \
                  'name=MongoDB Repository' \
                  'baseurl=https://repo.mongodb.org/yum/amazon/2023/mongodb-org/5.0/$basearch/' \
                  'gpgcheck=1' \
                  'enabled=1' \
                  'gpgkey=https://pgp.mongodb.com/server-5.0.asc' \
                  > /etc/yum.repos.d/mongodb-org-5.0.repo
                rpm --import https://pgp.mongodb.com/server-5.0.asc || true
                dnf_install mongodb-org-shell
                dnf remove -y mongodb-mongosh mongodb-database-tools 2>/dev/null || true
                # DocumentDB 4.0 needs database tools <= 100.6.1 (newer tools require wire v8)
                if ! dnf install -y mongodb-database-tools-100.6.1; then
                  curl -fsSL -o /tmp/mongodb-database-tools.tgz \
                    https://fastdl.mongodb.org/tools/db/mongodb-database-tools-rhel80-x86_64-100.6.1.tgz
                  tar -xzf /tmp/mongodb-database-tools.tgz -C /tmp
                  cp /tmp/mongodb-database-tools-*/bin/mongoimport /usr/local/bin/
                  cp /tmp/mongodb-database-tools-*/bin/mongoexport /usr/local/bin/ 2>/dev/null || true
                fi

                systemctl enable --now docker
                usermod -aG docker ec2-user 2>/dev/null || true

              else
                echo "Unsupported OS: $ID. Need Ubuntu (apt) or Amazon Linux (dnf)."
                exit 1
              fi

              command -v mongoimport >/dev/null 2>&1 || { echo "ERROR: mongoimport is not installed"; exit 1; }
              if ! command -v mongo >/dev/null 2>&1 && ! command -v mongosh >/dev/null 2>&1; then
                echo "ERROR: mongo or mongosh shell is not installed"
                exit 1
              fi
              command -v docker >/dev/null 2>&1 || { echo "ERROR: docker is not installed"; exit 1; }
              command -v mongo >/dev/null 2>&1 && mongo --version
              command -v mongosh >/dev/null 2>&1 && mongosh --version
              mongoimport --version
              docker --version

              aws s3 cp s3://${CFTBucketName}/updatescripts.sh ${RgSRC}/
              aws s3 cp s3://${CFTBucketName}/makeconfigs-inplace.sh ${RgSRC}/
              chmod +x ${RgSRC}/updatescripts.sh ${RgSRC}/makeconfigs-inplace.sh

              aws s3 cp s3://${CFTBucketName}/config.tar.gz ${RgSRC}/
              tar -xzvf ${RgSRC}/config.tar.gz -C ${RgSRC}

              APPUSER="rguser"
              APPUSERPWD=$(date +%s | sha256sum | base64 | tr -dc _a-z-0-9 | head -c 24)

              TOKEN=$(curl -sX PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
              ROLE_NAME="$(curl -sH "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/iam/security-credentials/)"
              ACCT_ID=$(curl -sH "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/dynamic/instance-identity/document | jq -r .accountId)

              ${RgSRC}/makeconfigs-inplace.sh \
                ${CognitoUserPool} \
                ${CognitoUserPoolClient} \
                ${CFTBucketName} \
                "rguser" \
                ${RGUrl} \
                ${AWS::Region} \
                ${HostedZoneId} \
                ${DocDBClusterRotationSecret} \
                ${RunId}

              aws s3 cp ${RgSRC}/config.tar.gz s3://${CFTBucketName}/

              rm -rf $RG_HOME/config
              ${RgSRC}/updatescripts.sh

              fixconfigs.sh
              fixdocdb.sh ${DBClusterEndpoint} ${Environment}-cc rguser $(aws secretsmanager get-secret-value --secret-id ${DocDBClusterRotationSecret} --region ${AWS::Region} --query SecretString --output text | jq -r .password) ${RGUrl}

              chmod +x /usr/local/sbin/swarm_init.sh
              start_server.sh ${RGUrl} ${RGTargetGroupArn}

              RG_HOME=/opt/deploy/sp2
              baseurl=$(jq -r '.baseURL' "$RG_HOME/config/config.json" | sed -e 's#/$##')
              token=$(jq -r '.tokenID[0]' "$RG_HOME/config/notification-config.json")

              if [ -z "$baseurl" ] || [ "$baseurl" = "null" ] || [ "$baseurl" = "REPLACE_WITH_BASE_URL" ]; then
                echo "Base URL is not configured in config.json. Exiting"
                exit 1
              fi

              TOKEN=$(curl -sX PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
              instanceid=$(curl -sH "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
              data="{\"username\":\"rgadmin\",\"first_name\":\"Admin\",\"last_name\":\"User\",\"email\":\"${AdminEmail}\",\"password\":\"RgAdmin@$instanceid\",\"level\":2}"

              curl -c cookies.txt -X GET -H "Content-Type: application/json" -H "token:$token" "$baseurl/user/signup"
              ctoken=$(awk '/XSRF-TOKEN/ {print $7}' cookies.txt)

              message=$(curl -b cookies.txt --location --request POST -H "X-CSRF-Token:$ctoken" --header "token:$token" --header "Content-Type: application/json" --data-raw "$data" "$baseurl/user/signup" | jq -r '.message')

              /opt/aws/bin/cfn-signal -e 0 --stack ${AWS::StackName} --resource RGEC2Instance --region ${AWS::Region}
            - RGTargetGroupArn: !GetAtt RGTargetGroup.TargetGroupArn
              Environment: !Ref Environment
              RgSRC: !Ref RgSRC
              RGUrl: !Ref RGUrl
              CFTBucketName: !Ref CFTBucketName
              CognitoUserPool: !Ref CognitoUserPool
              CognitoUserPoolClient: !Ref CognitoUserPoolClient
              HostedZoneId: !Ref HostedZoneId
              DocDBClusterRotationSecret: !Ref DocDBClusterRotationSecret
              DBClusterEndpoint: !GetAtt DBCluster.Endpoint
              AdminEmail: !Ref AdminEmail
              RunId: !Ref RunId

      CreationPolicy:
        ResourceSignal:
          Timeout: PT25M

  DocumentDBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Amazon DocumentDB Security Group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          CidrIp: 0.0.0.0/0
          FromPort: 27017
          ToPort: 27017
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "RG-DocDB-SG-${AWS::StackName}"

  # VPC Endpoint Security Group for Secrets Manager
  VpcendpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: vpc endpoint Security Group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: "0"
          ToPort: "65535"
          CidrIp: "0.0.0.0/0"
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "RG-VPCEndpoint-SG-${AWS::StackName}"

  # Secrets Manager VPC Endpoint
  SecretsManagerVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !GetAtt VpcendpointSecurityGroup.GroupId
      VpcEndpointType: Interface
      ServiceName:
        Fn::Sub: com.amazonaws.${AWS::Region}.secretsmanager
      PrivateDnsEnabled: true
      VpcId: !Ref VPC

  # DocumentDB Secret
  DocDBClusterRotationSecret:
    Type: "AWS::SecretsManager::Secret"
    Properties:
      Name: !Sub "RG-DocDB-Secret-${Environment}-${RunId}"
      Description: secrets for DocumentDB
      GenerateSecretString:
        SecretStringTemplate: '{"username": "rguser"}'
        GenerateStringKey: "password"
        PasswordLength: 16
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Name
          Value: !Sub "RG-DocDB-Secret-${Environment}-${RunId}"

  # DocumentDB Subnet Group
  DocumentDBSubnetGroup:
    Type: AWS::DocDB::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet Group for DocumentDB
      DBSubnetGroupName: !Sub "RG-DocDB-SubnetGroup-${AWS::StackName}"
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
        - !Ref PrivateSubnet3
      Tags:
        - Key: Name
          Value: !Sub "RG-DocDB-SubnetGroup-${AWS::StackName}"

  # DocumentDB Cluster
  DBCluster:
    Type: "AWS::DocDB::DBCluster"
    DeletionPolicy: Delete
    Properties:
      DBClusterIdentifier: !Sub "RG-DocDB-Cluster-${AWS::StackName}"
      MasterUsername: rguser
      MasterUserPassword:
        Fn::Sub: "{{resolve:secretsmanager:${DocDBClusterRotationSecret}::password}}"
      EngineVersion: 4.0.0
      DBSubnetGroupName: !Ref DocumentDBSubnetGroup
      VpcSecurityGroupIds:
        - !GetAtt DocumentDBSecurityGroup.GroupId
      StorageEncrypted: true

  # DocumentDB Instance
  DBInstance:
    Type: "AWS::DocDB::DBInstance"
    Properties:
      DBClusterIdentifier: !Ref DBCluster
      DBInstanceIdentifier: !Sub "RG-DocDB-Instance-${AWS::StackName}"
      DBInstanceClass: db.t3.medium
    DependsOn: DBCluster

  # Secret Attachment
  SecretDocDBClusterAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DocDBClusterRotationSecret
      TargetId: !Ref DBCluster
      TargetType: AWS::DocDB::DBCluster

  # Secret Rotation Schedule
  SecretRotationSchedule:
    Type: AWS::SecretsManager::RotationSchedule
    DependsOn: SecretDocDBClusterAttachment
    Properties:
      SecretId: !Ref DocDBClusterRotationSecret
      # RotationRules should be here, not under HostedRotationLambda
      RotationRules:
        Duration: 6h
        ScheduleExpression: "rate(30 days)"
      HostedRotationLambda:
        RotationType: MongoDBSingleUser
        RotationLambdaName: MongoDBSingleUser
        # These should be lists of IDs/references
        VpcSecurityGroupIds:
           !Join [",", [!GetAtt DocumentDBSecurityGroup.GroupId]]
        VpcSubnetIds: !Join [",", [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: "/"
      Policies:
        - PolicyName: root
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:DeleteLogGroup
                Resource: arn:aws:logs:*:*:*

  # Cognito Lambda: Post Confirmation
  LambdaFunction1:
    Type: "AWS::Lambda::Function"
    Properties:
      Description: "This trigger is invoked after a user is confirmed, allowing you to send custom messages or to add custom logic, for example for analytics."
      Environment:
        Variables:
          PORTAL_LINK: !Ref RGUrl
      FunctionName: !Sub "post_verification_send_message-${AWS::StackName}"
      Handler: "index.handler"
      Code:
        S3Bucket: !Ref CFTBucketName
        S3Key: post_verification_send_message.zip
      Role: !GetAtt "LambdaExecutionRole.Arn"
      MemorySize: 128
      Runtime: "nodejs18.x"
      Timeout: 60
      TracingConfig:
        Mode: "PassThrough"

  # Cognito Lambda: Pre Verification Custom Message
  LambdaFunction2:
    Type: "AWS::Lambda::Function"
    Properties:
      Description: "This trigger is invoked before a verification or MFA message is sent, allowing you to customize the message dynamically."
      Environment:
        Variables:
          PORTAL_LINK: !Ref RGUrl
      FunctionName: !Sub "pre_verification_custom_message-${AWS::StackName}"
      Handler: "index.handler"
      Code:
        S3Bucket: !Ref CFTBucketName
        S3Key: pre_verification_custom_message.zip
      Role: !GetAtt "LambdaExecutionRole.Arn"
      MemorySize: 128
      Runtime: "nodejs18.x"
      Timeout: 3
      TracingConfig:
        Mode: "PassThrough"

  # Cognito User Pool
  CognitoUserPool:
    Type: "AWS::Cognito::UserPool"
    Properties:
      UserPoolName: !Sub "RGUserPool-${AWS::StackName}"
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 90
      LambdaConfig:
        CustomMessage: !GetAtt LambdaFunction2.Arn
        PostConfirmation: !GetAtt LambdaFunction1.Arn
      Schema:
        - Name: "sub"
          AttributeDataType: "String"
          DeveloperOnlyAttribute: false
          Mutable: false
          Required: true
          StringAttributeConstraints:
