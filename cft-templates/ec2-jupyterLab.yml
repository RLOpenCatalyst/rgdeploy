AWSTemplateFormatVersion: '2010-09-09'

Description: Sets up Jupyter Lab environment on AWS

Parameters:
  Namespace:
    Type: String
    Description: An environment name that will be prefixed to resource names
  S3Mounts:
    Type: String
    Description: A JSON array of objects with name, bucket, and prefix properties used to mount data
  IamPolicyDocument:
    Type: String
    Description: The IAM policy to be associated with the launched workstation
  EnvironmentInstanceFiles:
    Type: String
    Description: >-
      An S3 URI (starting with "s3://") that specifies the location of files to be copied to
      the environment instance, including any bootstrap scripts
  InstanceType:
    Type: String
    Description: Instance type for JupyterLab.     
    ConstraintDescription: Valid instance type
  ContainerName:
    Type: String
    Description: Docker image of the application to be launched
    Default: relevancelab/jupyterlab-4.5.3:1.0.0
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2023/recommended/image_id
  
Conditions:
  IamPolicyEmpty: !Equals [!Ref IamPolicyDocument, '{}']

Resources:
  IAMRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Join ['-', [Ref: Namespace, 'jupyterLab-role']]
      Path: '/'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - 'ec2.amazonaws.com'
            Action:
              - 'sts:AssumeRole'
      Policies:
        - !If
          - IamPolicyEmpty
          - !Ref 'AWS::NoValue'
          - PolicyName: !Join ['-', [Ref: Namespace, 's3-studydata-policy']]
            PolicyDocument: !Ref IamPolicyDocument
        - PolicyName: param-store-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'ssm:GetParameter'
                  - 'ssm:PutParameter'
                  - 's3files:*'
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/*'  
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore          
        - arn:aws:iam::aws:policy/AmazonS3FilesClientFullAccess

  InstanceProfile:
    Type: 'AWS::IAM::InstanceProfile'
    Properties:
      InstanceProfileName: !Join ['-', [Ref: Namespace, 'jupyterLab-profile']]
      Path: '/'
      Roles:
        - Ref: IAMRole

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      SecurityGroupIngress:
        - CidrIp: "0.0.0.0/0"
          FromPort: 22
          ToPort: 22
          IpProtocol: tcp
        - CidrIp: "0.0.0.0/0"
          FromPort: 443
          ToPort: 443
          IpProtocol: tcp
      GroupDescription: JupyterLab Security Group

  EC2Instance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Timeout: PT10M
    Metadata:
      AWS::CloudFormation::Init:
        configSets:
          default:
            - config1
            - config2
        config1:
          files:
            '/home/ec2-user/docker-compose.yml':
              mode: '000755'
              owner: 'ec2-user'
              group: 'ec2-user'
              content: !Sub |
                version: "3.1"

                services:
                  nginx:
                    container_name: nginx
                    image: nginx:latest
                    ports:
                      - "80:80"
                      - "443:443"  
                    volumes:
                      - /etc/nginx/nginx.conf:/etc/nginx/nginx.conf
                      - /etc/nginx/dhparam.pem:/etc/nginx/dhparam.pem
                      - /etc/nginx/cert.key:/etc/nginx/cert.key
                      - /etc/nginx/cert.pem:/etc/nginx/cert.pem
                    networks:
                      - jupyterlab-net

                  jupyterlab: 
                    container_name: jupyterlab
                    image: ${ContainerName}
                    ports:
                      - "8888:8888"
                    volumes:
                      - /home/ec2-user:/home/ec2-user
                    networks:
                      - jupyterlab-net

                networks:
                  jupyterlab-net:
            '/home/ec2-user/mount_study.sh':
              mode: '000755'
              owner: 'ec2-user'
              group: 'ec2-user'
              content: !Sub |
                #!/bin/sh
                S3_MOUNTS='${S3Mounts}'
                # Exit if no S3 mounts were specified
                [ -z "$S3_MOUNTS" -o "$S3_MOUNTS" = "[]" ] && exit 0
                su - ec2-user -c "env PATH=$PATH:/usr/local/bin mount_s3.sh" 2>&1 >> /home/ec2-user/mount_s3.log
            '/home/ec2-user/start_jupyterlab.sh':
              mode: '000755'
              owner: 'ec2-user'
              group: 'ec2-user'
              content: !Sub |
                #!/usr/bin/env bash
                echo "Starting JupyterLab"
                cd /home/ec2-user
                until docker info >/dev/null 2>&1
                do
                  echo "Waiting for Docker..."
                  sleep 5
                done

                docker-compose up -d

                sleep 20
                TOKEN=$(curl -X PUT \
                  "http://169.254.169.254/latest/api/token" \
                  -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")

                instance_id=$(curl -s \
                  -H "X-aws-ec2-metadata-token: $TOKEN" \
                  http://169.254.169.254/latest/meta-data/instance-id)

                instance_region=$(curl -s \
                  -H "X-aws-ec2-metadata-token: $TOKEN" \
                  http://169.254.169.254/latest/meta-data/placement/region)

                access_token=$(docker exec jupyterlab jupyter server list | grep -o 'token=[^ ]*' | head -1 | cut -d= -f2 | cut -d: -f1)

                echo "TOKEN=$access_token"

                if [ -n "$access_token" ]; then
                  aws ssm put-parameter \
                    --name "/RL/RG/jupyterLab/auth-token/$instance_id" \
                    --value "$access_token" \
                    --region "$instance_region" \
                    --type SecureString \
                    --overwrite

                  echo "Stored Jupyter token in SSM"
                else
                  echo "FAILED: token empty"
                  exit 1
                fi
            '/var/log/jupyterlab.log':
              content: "\n"
              mode: '000664'
              owner: 'ec2-user'
              group: 'ec2-user'
        config2:
          commands:
            01_mount_study:
              cwd: '/home/ec2-user'
              command: '/home/ec2-user/mount_study.sh'
            02_start_jupyterlab:
              cwd: '/home/ec2-user'
              command: '/home/ec2-user/start_jupyterlab.sh'



    Properties:
      ImageId : !Ref LatestAmiId
      InstanceType: !Ref 'InstanceType'
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 32
            Encrypted: false      
      SecurityGroups: [!Ref 'EC2SecurityGroup']
      IamInstanceProfile: !Ref InstanceProfile
      PropagateTagsToVolumeOnCreation: true
      Tags:
        - Key: Name
          Value: !Join ['-', [Ref: Namespace, 'jupyterLab']]
        - Key: Description
          Value: EC2 linux based JupyterLab server
        - Key: cost_resource
          Value: !Sub ${AWS::StackName}
      UserData: 
        Fn::Base64: !Sub |
          #!/bin/bash 
          exec > >(tee /var/log/user-data.log|logger -t user-data -s 2>/dev/console) 2>&1

          # Install CFN bootstrap
          sudo dnf install -y aws-cfn-bootstrap amazon-efs-utils

          # Enable Docker
          sudo systemctl enable docker
          sudo systemctl start docker
          sudo usermod -aG docker ec2-user

          # Enable SSM agent
          sudo systemctl enable amazon-ssm-agent
          sudo systemctl restart amazon-ssm-agent

          # Install Docker Compose v2
          # sudo curl -SL \
          # https://github.com/docker/compose/releases/download/v2.39.1/docker-compose-linux-x86_64 \
          # -o /usr/local/bin/docker-compose

          sudo curl -SL \
          https://github.com/docker/compose/releases/download/v5.1.4/docker-compose-linux-x86_64 \
          -o /usr/local/bin/docker-compose

          sudo chmod +x /usr/local/bin/docker-compose
          sudo ln -sf /usr/local/bin/docker-compose /usr/bin/docker-compose
          sudo chmod +x /usr/bin/docker-compose

          docker-compose version
          docker --version

          # Pull containers
          docker pull ${ContainerName}
          docker pull nginx:latest

          # Copy environment instance files needed for the workspace
          aws s3 cp --region "${AWS::Region}" "${EnvironmentInstanceFiles}/jupyterlab/" "/tmp/jupyterlab" --recursive
          aws s3 cp --region "${AWS::Region}" "${EnvironmentInstanceFiles}/create_self_signed_cert.sh" "/tmp"
          # aws s3 cp --region "${AWS::Region}" "${EnvironmentInstanceFiles}/secret.txt" "/root"

          mkdir -p "/etc/nginx"
          mv /tmp/jupyterlab/nginx.conf /etc/nginx/nginx.conf

          # Create self signed certificates
          chmod 500 "/tmp/create_self_signed_cert.sh"
          /tmp/create_self_signed_cert.sh         

          # Add command to start jupyterLab at reboot
          sudo crontab -l 2>/dev/null > "/tmp/crontab"
          echo '@reboot cd /home/ec2-user && sudo /home/ec2-user/mount_study.sh 2>&1 >> /home/ec2-user/mount_s3.log' >> "/tmp/crontab"
          echo '@reboot cd /home/ec2-user && sudo /home/ec2-user/start_jupyterlab.sh 2>&1 >> /var/log/jupyterLab.log' >> "/tmp/crontab"          
          sudo crontab "/tmp/crontab"

          # Mount study
          aws s3 cp --region "${AWS::Region}" "${EnvironmentInstanceFiles}/get_bootstrap.sh" "/tmp"
          chmod 500 "/tmp/get_bootstrap.sh"
          /tmp/get_bootstrap.sh "${EnvironmentInstanceFiles}" '${S3Mounts}' "${AWS::Region}"          

          # init command to create files from config
          /opt/aws/bin/cfn-init --verbose --stack ${AWS::StackName} --resource EC2Instance --region ${AWS::Region}

          # Signal result to CloudFormation
          /opt/aws/bin/cfn-signal -e $? --stack "${AWS::StackName}" --resource "EC2Instance" --region "${AWS::Region}"


Outputs:
  InstanceDNSName:
    Value: !GetAtt EC2Instance.PublicDnsName
    Description: Public DNS Name
  InstanceIPAddress: 
    Value: !GetAtt EC2Instance.PublicIp
  InstanceId:
    Value: !Ref 'EC2Instance'
  ApplicationPort:
    Value: '443'
  AvailabilityZone: 
    Description: AvailabilityZone of newly created JupyterLab EC2Instance
    Value: !GetAtt [EC2Instance, AvailabilityZone]  
