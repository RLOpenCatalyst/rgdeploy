Metadata:
  License: Apache-2.0
AWSTemplateFormatVersion: "2010-09-09"
Description: "AWS CloudFormation Template to create an GPU based EC2 instance with NICE-DCV pre installed."

Parameters:
  Namespace:
    Type: String
    Description: An environment name that will be prefixed to resource names
  S3Mounts:
    Type: String
    Description: A JSON array of objects with name, bucket, and prefix properties used to mount data
  IamPolicyDocument:
    Type: String
    Description: The IAM policy to be associated with the launched workstation
  VPC:
    Description: The VPC in which the EC2 instance will reside
    Type: AWS::EC2::VPC::Id
  Subnet:
    Description: The VPC subnet in which the EC2 instance will reside
    Type: AWS::EC2::Subnet::Id
  ALBSecurityGroup:
    Description: Security Group Id of the ALB to which the EC2 instance traffic will be allowed from
    Type: AWS::EC2::SecurityGroup::Id    
  WorkSpaceSecurityGroup:  
    Description: Security Group Id of the workspace to which the EC2 instance traffic will be allowed from
    Type: AWS::EC2::SecurityGroup::Id 
  EnvironmentInstanceFiles:
    Type: String
    Description: >-
      An S3 URI (starting with "s3://") that specifies the location of files to be copied to
      the environment instance, including any bootstrap scripts
     
  InstanceType:
    Description: Choose the instance type e.g t3.medium (2vCPU , 2GiB RAM), t3.large (2vCPU, 8GiB RAM), t3.xlarge(4vCPU, 16GiB RAM)
    Type: String
    Default: t3.large
    AllowedValues:
      [
        t3.medium,
        t3.large,
        t3.xlarge,
        m6.xlarge
        
      ]
    ConstraintDescription: must be a valid EC2 instance type.
  EBSVolumeSize:
    Description: The initial size of the volume (in GBs)  EBS will use for storage.
    Type: Number
    Default: 70

Conditions:
  IamPolicyEmpty: !Equals [!Ref IamPolicyDocument, "{}"]

Resources:
  SSMPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Join ["-", [!Ref Namespace, "SSM-Policy"]]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSSMParamActions
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:PutParameter
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:DescribeParameters
            Resource: "*"
          - Sid: AllowAccessToEncryptionKeys
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:DescribeKey
              - s3:*
            Resource: "*"
  InstanceRolePermissionBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Permission boundary for EC2 instance role
      ManagedPolicyName: !Join ['-', [Ref: Namespace, 'ec2-linux-permission-boundary']]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 's3:*'
              - 's3files:*'
            Resource: '*'
          - Effect: Allow
            Action:
              - 'sts:*'
            Resource: '*'          
          - Effect: Allow
            Action:
              - 'kms:*'
            Resource: '*'
          - Effect: Allow
            Action:
              - 'ssm:*'
            Resource: '*'
          - Effect: Allow
            Action:
              - 'ssmmessages:*'
            Resource: '*'
          - Effect: Allow
            Action:
              - 'ec2messages:*'
            Resource: '*'
          - Effect: Allow
            Action:
              - 'sns:Publish'     
            Resource: '*'                    
          
  IAMRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Join ['-', [Ref: Namespace, 'ec2-role']]
      Path: '/'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - 'ec2.amazonaws.com'
            Action:
              - 'sts:AssumeRole'
      Policies:
        - !If
          - IamPolicyEmpty
          - !Ref 'AWS::NoValue'
          - PolicyName: !Join ['-', [Ref: Namespace, 's3-studydata-policy']]
            PolicyDocument: !Ref IamPolicyDocument
      ManagedPolicyArns:
        - Ref: SSMPolicy
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonS3FilesClientFullAccess
      PermissionsBoundary: !Ref InstanceRolePermissionBoundary



  InstanceProfile:
    Type: "AWS::IAM::InstanceProfile"
    Properties:
      InstanceProfileName: !Join ["-", [Ref: Namespace, "ec2-profile"]]
      Path: "/"
      Roles:
        - Ref: IAMRole

  EC2Instance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Timeout: PT15M
    Metadata:
      AWS::CloudFormation::Init:
        configSets:
          default:
            - config1
        config1:
          files:
            "/home/ec2-user/.config/autostart/studymount.desktop":
              mode: "000644"
              owner: "ec2-user"
              group: "ec2-user"
              content: |
                [Desktop Entry]
                Type=Application
                Exec="/home/ec2-user/mount_study.sh"
                Hidden=false
                NoDisplay=false
                X-GNOME-Autostart-enabled=true
                Terminal=true
                Name=Study-Mounting
                Comment=Study Mounting
            "/home/ec2-user/.config/autostart/disable-lock.desktop":
              mode: "000644"
              owner: "ec2-user"
              group: "ec2-user"
              content: |
                [Desktop Entry]
                Type=Application
                Exec="/home/ec2-user/disable_lock.sh"
                Hidden=false
                NoDisplay=true
                X-GNOME-Autostart-enabled=true
                Name=Disable-Lock-Screen
            "/home/ec2-user/rstudio.sh":
              mode: "000755"
              owner: "ec2-user"
              group: "ec2-user"
              content: !Sub |
                #!/bin/bash
                set -euo pipefail
                # Ensure 8787 is free before starting rstudio container.
                # This handles both stale containers and non-docker listeners.
                docker rm -f rstudio >/dev/null 2>&1 || true
                pids=$(ss -ltnp 'sport = :8787' 2>/dev/null | sed -n 's/.*pid=\([0-9]\+\).*/\1/p' | sort -u)
                if [ -n "$pids" ]; then
                  echo "$pids" | xargs -r kill -9 || true
                fi
                if [ -z "$(docker ps -f "name=rstudio" -f "status=running" -q)" ]; then
                  docker rm -f rstudio >/dev/null 2>&1 || true
                  docker run --rm -d --name rstudio -e DISABLE_AUTH=true -v /home/ec2-user:/home/ec2-user -p 8787:8787 relevancelab/rstudio_4.2.1:1.0.3
                  sleep 3
                fi
                xdg-open "http://localhost:8787/" >/dev/null 2>&1 || true
            "/home/ec2-user/jupyter.sh":
              mode: "000755"
              owner: "ec2-user"
              group: "ec2-user"
              content: !Sub |
                #!/bin/bash
                set -euo pipefail
                if [ -z "$(docker ps -f "name=jupyterlab" -f "status=running" -q)" ]; then
                  docker rm -f jupyterlab >/dev/null 2>&1 || true
                  docker run --rm -d --name jupyterlab -p 8888:8888 -v /home/ec2-user:/home/ec2-user relevancelab/jupiterlab_3.5.0:1.0.3
                  sleep 3
                fi
                jtoken=$(docker exec jupyterlab /bin/bash -lc "jupyter server list" 2>/dev/null | sed -n 's/.*token=\([^& ]*\).*/\1/p' | head -n1)
                if [ -z "$jtoken" ]; then
                  jtoken=$(docker logs jupyterlab 2>&1 | sed -n 's/.*token=\([^& ]*\).*/\1/p' | head -n1)
                fi
                if [ -n "$jtoken" ]; then
                  xdg-open "http://127.0.0.1:8888/?token=$jtoken" >/dev/null 2>&1 || true
                else
                  xdg-open "http://127.0.0.1:8888/" >/dev/null 2>&1 || true
                fi
            "/home/ec2-user/mount_study.sh":
              mode: "000755"
              owner: "ec2-user"
              group: "ec2-user"
              content: !Sub |
                #!/bin/sh
                set -x
                # Adding sleep to avoid mounting failure
                sleep 30
                mount_s3.sh 2>&1 >> /home/ec2-user/mount_s3.log
            "/home/ec2-user/set_user_token.sh":
              mode: "000755"
              owner: "ec2-user"
              group: "ec2-user"
              content: !Sub |
                #!/bin/bash
                trap '/opt/aws/bin/cfn-signal --exit-code 1 --resource EC2Instance --region ${AWS::Region} --stack ${AWS::StackName}' ERR

                # Get the session token
                TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")

                # Use instance metadata for region/instance so token is always written to the running instance region.
                instance_id=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
                region=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/region)
                echo "Retrieved instance_id $instance_id from metadata service"
                session_id="rg-session"
                auth_token=`uuidgen`
                parameter_name="/RL/RG/secure-desktop/auth-token/$instance_id"
                aws ssm put-parameter --name "$parameter_name" --type "String" --value '{"auth_token":"'$auth_token'","session_id":"'$session_id'"}' --region ${AWS::Region} --overwrite
                echo "User token set successfully"
            "/etc/systemd/system/dcv-auth.service":
              mode: "000644"
              owner: "root"
              group: "root"
              content: !Sub |
                [Unit]
                Description=NICE DCV Auth Service
                After=network-online.target docker.service
                Wants=network-online.target
                Requires=docker.service

                [Service]
                TimeoutStartSec=0
                Restart=always
                RestartSec=5
                Environment=AWS_REGION=${AWS::Region}
                Environment=AWS_DEFAULT_REGION=${AWS::Region}

                ExecStartPre=/bin/sleep 10
                ExecStartPre=-/usr/bin/docker stop dcv-auth
                ExecStartPre=-/usr/bin/docker rm dcv-auth

                ExecStart=/usr/bin/docker run \
                  --name dcv-auth \
                  --restart unless-stopped \
                  -p 8445:8445 \
                  -e PORT=8445 \
                  -e PARAMNAMEPREFIX=/RL/RG/secure-desktop/auth-token/ \
                  relevancelab/nice-dcv-auth-svc:1.0.2

                ExecStop=/usr/bin/docker stop dcv-auth

                [Install]
                WantedBy=multi-user.target
            "/home/ec2-user/disable_lock.sh":
              content: !Sub |
                #!/bin/bash
                gsettings set org.gnome.desktop.lockdown disable-lock-screen 'true'
                echo "Lock disabled successfully"
              mode: "000755"
              owner: "ec2-user"
              group: "ec2-user"
    Properties:
      LaunchTemplate:
        LaunchTemplateName: "RG-IMDSv2"
        Version: 1    
      UserData:
        Fn::Base64: !Sub |
          #!/usr/bin/env bash
          exec > >(tee /var/log/user-data.log|logger -t user-data -s 2>/dev/console) 2>&1
          # trap '/opt/aws/bin/cfn-signal --exit-code 1 --resource EC2Instance --region ${AWS::Region} --stack ${AWS::StackName}' ERR
          sudo dnf install -y amazon-efs-utils
          # Copy environment instance files needed for the workspace
          aws s3 cp --region "${AWS::Region}" "${EnvironmentInstanceFiles}/secure_desktop/secure_desktop.perm" "/etc/dcv/"
          aws s3 cp --region "${AWS::Region}" "${EnvironmentInstanceFiles}/get_bootstrap.sh" "/tmp"
          chmod 500 "/tmp/get_bootstrap.sh"
          /tmp/get_bootstrap.sh "${EnvironmentInstanceFiles}" '${S3Mounts}' "" "${AWS::Region}"

          cat << 'EOF' > /usr/local/bin/start-dcv-session
          #!/bin/bash
          systemctl stop gdm 2>/dev/null || true
          systemctl disable gdm 2>/dev/null || true
          dcv close-session lock-session 2>/dev/null || true

          service_name="dcvserver"
          timeout=60
          elapsed_time=0

          echo "Waiting for $service_name to become active..."
          while true; do
            status=$(systemctl is-active $service_name)
            if [[ $status == "active" ]]; then
              echo "$service_name is now active."
              break
            fi
            if [[ $elapsed_time -ge $timeout ]]; then
              echo "Timeout: $service_name did not become active within $timeout seconds."
              exit 1
            fi
            sleep 1
            elapsed_time=$((elapsed_time+1))
          done

          dcv close-session rg-session 2>/dev/null || true
          dcv create-session rg-session --name rg-session --type=virtual --user ec2-user --owner ec2-user --permissions-file /etc/dcv/secure_desktop.perm

          for i in {1..10}; do
            if dcv list-sessions 2>/dev/null | grep -q rg-session; then
              echo "rg-session is running."
              break
            fi
            if [[ $i -eq 10 ]]; then
              echo "rg-session failed to stay running."
              exit 1
            fi
            sleep 2
            dcv close-session rg-session 2>/dev/null || true
            dcv create-session rg-session --name rg-session --type=virtual --user ec2-user --owner ec2-user --permissions-file /etc/dcv/secure_desktop.perm
          done

          dcv list-sessions
          date
          EOF

          chown root:root /usr/local/bin/start-dcv-session
          chmod 755 /usr/local/bin/start-dcv-session

          sleep 5
          # Clean existing containers/ports so this block is safe on reruns
          docker stop rstudio jupyterlab 2>/dev/null || true
          docker rm -f rstudio jupyterlab 2>/dev/null || true

          # Run init script to create files (including dcv-auth.service) before touching dcvserver
          /opt/aws/bin/cfn-init --verbose --stack ${AWS::StackName} --resource EC2Instance --region ${AWS::Region}

          # -----------------------------
          # CREATE TOKEN BEFORE AUTH START
          # -----------------------------

          echo "Creating DCV auth token..."
          sudo -u ec2-user /home/ec2-user/set_user_token.sh

          echo "Waiting for token propagation..."

          IMDS_TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" \
          -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")

          INSTANCE_ID=$(curl -s -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" \
          http://169.254.169.254/latest/meta-data/instance-id)

          REGION=$(curl -s -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" \
          http://169.254.169.254/latest/meta-data/placement/region)

          for i in {1..15}
          do
            TOKEN_VALUE=$(aws ssm get-parameter \
              --name "/RL/RG/secure-desktop/auth-token/$INSTANCE_ID" \
              --region "$REGION" \
              --query Parameter.Value \
              --output text 2>/dev/null)

            if [ ! -z "$TOKEN_VALUE" ]; then
              echo "Token confirmed in SSM"
              break
            fi

            echo "Waiting..."
            sleep 2
          done

          # -----------------------------
          # NOW START AUTH SERVICE
          # -----------------------------

          systemctl daemon-reload
          systemctl enable dcv-auth
          systemctl start dcv-auth

          echo "Restarting dcvserver..."
          systemctl restart dcvserver

          sleep 10

          echo "Preparing DCV virtual session environment..."
          loginctl enable-linger ec2-user
          chown -R ec2-user:ec2-user /home/ec2-user
          systemctl stop gdm 2>/dev/null || true
          systemctl disable gdm 2>/dev/null || true

          /usr/local/bin/start-dcv-session

          # Add command to start on reboot
          crontab -l 2>/dev/null > /tmp/crontab
          echo '@reboot systemctl stop gdm' >> "/tmp/crontab"
          echo '@reboot systemctl start dcvserver' >> "/tmp/crontab"
          echo '@reboot /usr/local/bin/start-dcv-session 2>&1 >> /var/log/start-dcv-session.log' >> "/tmp/crontab"
          echo '@reboot /home/ec2-user/set_user_token.sh 2>&1 >> /var/log/set_user_token.log' >> "/tmp/crontab"
          echo '@reboot systemctl start dcv-auth' >> "/tmp/crontab"

          crontab "/tmp/crontab"

          # Remove password for ec2-user; lock screen is disabled via GNOME autostart
          passwd -l ec2-user


          sudo -u ec2-user /home/ec2-user/rstudio.sh
          sudo -u ec2-user /home/ec2-user/jupyter.sh
          dcv list-sessions

          echo "Session ready. Sending signal."
          /opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource EC2Instance --region ${AWS::Region}

      InstanceType: !Ref "InstanceType"
      
      ImageId: "{{resolve:ssm:/RL/RG/StandardCatalog/linux-nice-dcv-ami}}"
      IamInstanceProfile: !Ref InstanceProfile
            
      
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref EBSVolumeSize
            Encrypted: true
                 
      NetworkInterfaces:
        - AssociatePublicIpAddress: 'false'
          DeviceIndex: '0'
          GroupSet:
            - !Ref InstanceSecurityGroup
            - !Ref WorkSpaceSecurityGroup
          SubnetId: !Ref Subnet            
      PropagateTagsToVolumeOnCreation: true
      Tags:
        - Key: Name
          Value: !Join ["-", [Ref: Namespace, "ec2-secure-linux"]]
        - Key: Description
          Value: EC2 workspace instance
        - Key: cost_resource
          Value: !Sub ${AWS::StackName}
        - Key: PatchGroup
          Value: RG-PatchGroup-Linux          

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EC2 workspace security group
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 0
          ToPort: 65535
          CidrIp: 0.0.0.0/0
          
      SecurityGroupIngress:     
        - IpProtocol: tcp
          FromPort: 8443
          ToPort: 8443      
          SourceSecurityGroupId: !Ref ALBSecurityGroup         
      VpcId: !Ref VPC
         
Outputs:
  InstanceId:
    Description: InstanceId of the newly created EC2 instance
    Value: !Ref "EC2Instance"

  ApplicationPort:
    Description: The Port in which the application is running
    Value: "8443"
  AvailabilityZone: 
    Description: AvailabilityZone of newly created EC2 instance
    Value: !GetAtt [EC2Instance, AvailabilityZone]
